name: E2E Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm start > server.log 2>&1 &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/users

      - name: Show server logs
        if: failure()
        run: cat server.log

      - name: Run E2E tests
        run: npm run test:e2e
